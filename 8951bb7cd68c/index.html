<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1b2a49">
<link rel="icon" href="data:,">
<title>Игра для Нади</title>
<style>
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
         background: linear-gradient(180deg, #f9d9b8 0%, #e98f6f 45%, #2d3f66 80%, #1b2a49 100%);
         color: #1b2a49; font: 600 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  #s { background: #fffaf4; border-radius: 22px; padding: 22px 26px; max-width: 360px; box-shadow: 0 18px 50px -18px rgba(27, 42, 73, .55); }
</style>
</head>
<body>
<p id="s">Загружаю игру… ❤️</p>
<script>
(function () {
  var s = document.getElementById("s");
  function fail() { s.textContent = "Эта страница открывается только по полной ссылке из QR-кода."; }
  try {
    var k = location.hash.slice(1);
    if (!k || !window.crypto || !crypto.subtle) return fail();
    k = k.replace(/-/g, "+").replace(/_/g, "/"); while (k.length % 4) k += "=";
    var raw = new Uint8Array(atob(k).split("").map(function (c) { return c.charCodeAt(0); }));
    var keyP = crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    var binP = fetch("q.bin", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw 0; return r.arrayBuffer(); });
    Promise.all([keyP, binP]).then(function (a) {
      var b = new Uint8Array(a[1]);
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, a[0], b.slice(12));
    }).then(function (pt) {
      var html = new TextDecoder().decode(pt);
      document.open(); document.write(html); document.close();
    }).catch(fail);
  } catch (e) { fail(); }
})();
</script>
</body>
</html>
